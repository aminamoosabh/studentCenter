<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مركز الطالبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #6c5ce7;
    --primary-dark: #5a4bd1;
    --header-bg: #122355;
    --header-bg-dark: #0b1738;
    --bg: #f6f5fb;
    --card-bg: #ffffff;
    --border: #e3e1f0;
    --text: #2d2a3d;
    --muted: #7a7690;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Cairo", "Tahoma", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--header-bg), var(--header-bg-dark));
    color: #fff;
    text-align: center;
    padding: 36px 16px 28px;
  }
  header h1 { margin: 0 0 6px; font-size: 1.8rem; }
  header p { margin: 0; opacity: 0.9; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .service-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(80, 70, 150, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: block;
  }
  .service-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(80, 70, 150, 0.12);
  }
  .service-card .icon { font-size: 2rem; margin-bottom: 8px; }
  .service-card h2 { margin: 0 0 6px; font-size: 1.15rem; color: var(--primary-dark); }
  .service-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .service-card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .badge-soon {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.75rem;
    background: #f1f1f1;
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 12px;
  }
  .site-footer {
    text-align: center;
    padding: 18px 16px 26px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .account-link {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 6px 12px;
  }
</style>
</head>
<body>
  <header style="position: relative;">
    <a href="auth/login.html" class="account-link">تسجيل الدخول</a>
    <h1>مركز الطالبة</h1>
    <p>خدمات تهمك خلال رحلتك الدراسية</p>
  </header>

  <main>
    <div class="services-grid">
      <a href="gpa/index.html" class="service-card">
        <div class="icon">📊</div>
        <h2>حساب المعدل</h2>
        <p>احسبي معدلك الفصلي والتراكمي لكل فصل من فصولك الستة بسهولة.</p>
      </a>

      <div class="service-card disabled">
        <div class="icon">🗓️</div>
        <h2>خدمات قادمة</h2>
        <p>نعمل على إضافة المزيد من الخدمات المفيدة لكِ قريبًا.</p>
        <span class="badge-soon">قريبًا</span>
      </div>
    </div>
  </main>

  <footer class="site-footer">إعداد: أ. أمينة محمد الصائغ</footer>
</body>
</html>
