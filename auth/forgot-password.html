<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نسيت كلمة المرور | مركز الطالبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>
  <header class="topbar"><h1>نسيت كلمة المرور</h1></header>

  <main>
    <div class="card">
      <h2>بنرسل لك رابط لإعادة التعيين</h2>
      <form id="forgot-form">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="primary-btn">إرسال رابط إعادة التعيين</button>
        <p class="msg hidden" id="msg"></p>
      </form>
      <div class="links">
        تذكّرتِها؟ <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>
    <a class="back-home" href="../index.html">⟵ الرجوع للرئيسية</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
