<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول | مركز الطالبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>
  <header class="topbar"><h1>تسجيل الدخول</h1></header>

  <main>
    <div class="card">
      <h2>مرحبًا بعودتك</h2>
      <form id="login-form">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="primary-btn">دخول</button>
        <p class="msg hidden" id="msg"></p>
      </form>
      <div class="links">
        <a href="forgot-password.html">نسيتِ كلمة المرور؟</a>
        &nbsp;·&nbsp;
        <a href="signup.html">إنشاء حساب جديد</a>
      </div>
    </div>
    <a class="back-home" href="../index.html">⟵ الرجوع للرئيسية</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
